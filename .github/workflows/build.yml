name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: ubuntu-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macos-appleclang
            os: macos-latest
            cc: clang
            cxx: clang++
          - name: windows-msvc
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install coverage tools
        run: sudo apt-get update && sudo apt-get install --yes lcov

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSHAPES_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: |
          set -euo pipefail
          lcov --directory build --capture --output-file build/coverage.info
          lcov --remove build/coverage.info '/usr/*' '*/tests/*' '*/thirdparty/*' --output-file build/coverage.info
          lcov --list build/coverage.info
          genhtml build/coverage.info --output-directory build/coverage
          coverage="$(lcov --summary build/coverage.info | awk '/lines\.*:/ { gsub(/%/, "", $2); print $2 }')"
          test -n "${coverage}"
          color="$(awk -v coverage="${coverage}" 'BEGIN {
            if(coverage >= 90) {
              print "brightgreen"
            } else if(coverage >= 80) {
              print "green"
            } else if(coverage >= 70) {
              print "yellowgreen"
            } else if(coverage >= 60) {
              print "yellow"
            } else if(coverage >= 50) {
              print "orange"
            } else {
              print "red"
            }
          }')"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "${coverage}" "${color}" > build/coverage/badge.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/coverage.info
            build/coverage

      - name: Publish coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pages_repo="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads "${pages_repo}" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "${pages_repo}" gh-pages
          else
            git init gh-pages
            git -C gh-pages checkout -b gh-pages
            git -C gh-pages remote add origin "${pages_repo}"
          fi
          rm -rf gh-pages/coverage
          mkdir -p gh-pages/coverage
          cp -R build/coverage/. gh-pages/coverage/
          touch gh-pages/.nojekyll
          git -C gh-pages add coverage .nojekyll
          if git -C gh-pages diff --cached --quiet; then
            echo "Coverage report is already up to date"
            exit 0
          fi
          git -C gh-pages commit -m "Update coverage report"
          git -C gh-pages push origin gh-pages

  documentation:
    name: documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install --yes doxygen

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build documentation
        run: cmake --build build --target shapes_documentation

  release:
    name: release
    runs-on: ubuntu-latest
    needs:
      - test
      - coverage
      - documentation
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release asset
        run: |
          set -euo pipefail
          mkdir -p dist
          cp single_include/simo/shapes.hpp dist/shapes.hpp

      - name: Smoke-test release asset
        run: |
          set -euo pipefail
          cat > dist/smoke.cpp <<'CPP'
          #include "shapes.hpp"

          int main()
          {
              simo::shapes::Point point{1.0, 2.0};
              return point.x == 1.0 && point.y == 2.0 ? 0 : 1;
          }
          CPP
          g++ -std=c++14 -Wall -Wextra -pedantic -I dist -c dist/smoke.cpp -o dist/smoke.o

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/shapes.hpp --clobber
          else
            gh release create "${TAG_NAME}" dist/shapes.hpp \
              --title "${TAG_NAME}" \
              --generate-notes \
              --verify-tag
          fi
